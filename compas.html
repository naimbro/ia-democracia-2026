<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Compás — IA y Democracia 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@600&display=swap');
:root{ --paper:#EBE6D8; --ink:#22281F; --ink-soft:#4A5142; --stamp:#9C2B2F; --line:#C7BEA3; }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',sans-serif;
  display:flex; align-items:center; justify-content:center; gap:5vw; flex-wrap:wrap;
  padding:4vh max(16px,4vw); text-align:left;
}
.qr{background:#fff; padding:2vh; border:1px solid var(--line); line-height:0;}
.qr svg{width:min(72vh,80vw); height:auto; display:block;}
.texto{display:flex; flex-direction:column; gap:2.4vh; max-width:34em;}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:clamp(12px,1.3vw,18px); letter-spacing:.14em; text-transform:uppercase; color:var(--stamp);}
h1{font-family:'Fraunces',serif; font-size:clamp(40px,6vw,96px); line-height:1;}
p{font-size:clamp(16px,1.8vw,28px); line-height:1.35;}
.codigo{font-family:'IBM Plex Mono',monospace; font-size:clamp(28px,4vw,64px); letter-spacing:.12em; color:var(--stamp);}
.url{font-family:'IBM Plex Mono',monospace; font-size:clamp(11px,1vw,15px); color:var(--ink-soft); word-break:break-all;}
</style>
</head>
<body>
  <div class="qr" id="qr" aria-label="Código QR para entrar al compás"></div>
  <div class="texto">
    <p class="eyebrow">IA y Democracia · Semana 15</p>
    <h1>Compás</h1>
    <p>Escanea el código con el teléfono y entra con tu cuenta de Google. Diez preguntas: al final quedas en una bancada.</p>
    <p>Sala <span class="codigo" id="codigo">AXWP</span></p>
    <p class="url" id="url"></p>
  </div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
  // El código de la sala se puede cambiar con ?sala=XXXX; por defecto, el compás del jueves 19-nov.
  var sala = (new URLSearchParams(location.search).get('sala') || 'AXWP').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var url = 'https://naimbro.github.io/tribuna/galeria.html?sala=' + sala;
  document.getElementById('codigo').textContent = sala;
  document.getElementById('url').textContent = url;
  try {
    var q = qrcode(0, 'M'); q.addData(url); q.make();
    document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  } catch (e) {
    document.getElementById('qr').textContent = 'No se pudo dibujar el QR: entren a ' + url;
  }
</script>
</body>
</html>
